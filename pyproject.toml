[project]
name = "repo-seance"
version = "0.1.0"
description = "Summon the ghosts of your git repo, narrated by a local open-weight model."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
seance = "seance.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seance"]
